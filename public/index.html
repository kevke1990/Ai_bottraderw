<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI BotTrader</title><style>:root{--b:#07111f;--p:#0d1b2d;--l:#1d3550;--t:#edf5ff;--m:#8ea5bc;--a:#55aaff;--g:#36d399;--r:#ff647d;--y:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}header{padding:12px 18px;border-bottom:1px solid var(--l);display:flex;gap:10px;align-items:center;position:sticky;top:0;background:#07111fee;z-index:3;flex-wrap:wrap}.logo{font-size:20px;font-weight:800}.logo i{color:var(--a);font-style:normal}button,input,select{font:inherit}.n,.btn,.chip{background:var(--p);color:var(--t);border:1px solid var(--l);padding:8px 10px;border-radius:8px;cursor:pointer}.n.on,.primary,.chip.on{background:var(--a);color:#04101a;border-color:var(--a);font-weight:700}.search{margin-left:auto;background:var(--p);color:var(--t);border:1px solid var(--l);padding:9px;border-radius:8px;width:240px}main{max-width:1500px;margin:auto;padding:20px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}h1{margin:0 0 5px}.m{color:var(--m)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:15px}.big{font-size:27px;font-weight:800;margin:4px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #193049}th{font-size:11px;color:var(--m)}.star{border:0;background:none;color:var(--y);font-size:18px;cursor:pointer}.pill{padding:4px 7px;border-radius:6px;background:#143451}.bar{height:8px;background:#19304a;border-radius:9px}.bar i{display:block;height:100%;background:var(--a);border-radius:9px}.page{display:none}.page.on{display:block}.form{display:grid;gap:9px}.form input,.form select{width:100%;background:#081525;color:var(--t);border:1px solid var(--l);padding:9px;border-radius:8px}.box{padding:10px;background:#0a2035;border-left:3px solid var(--a);margin:8px 0}.chart{height:130px;display:flex;align-items:end;gap:3px}.c{flex:1;background:#28608a}@media(max-width:1000px){.grid,.three{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:650px){.search{order:3;width:100%;margin:0}.grid,.three{grid-template-columns:1fr}.hero{display:block}}
</style><header><div class="logo">AI <i>BotTrader</i></div><nav id="nav"></nav><input id="q" class="search" placeholder="Zoek ticker, bedrijf of ISIN"></header><main id="app"></main><script>
const S=[['NVDA','NVIDIA','NASDAQ',174.15,2.81,94,'STRONG BUY'],['AVGO','Broadcom','NASDAQ',295.4,1.88,91,'STRONG BUY'],['MSFT','Microsoft','NASDAQ',506.2,.72,89,'BUY'],['GOOGL','Alphabet','NASDAQ',214.18,1.03,88,'BUY'],['AAPL','Apple','NASDAQ',229.6,1.42,86,'BUY'],['ASML','ASML Holding','AMS',672.4,.91,84,'BUY'],['ORCL','Oracle','NYSE',251.9,2.06,87,'BUY'],['AMZN','Amazon','NASDAQ',231.45,-.35,82,'BUY'],['JPM','JPMorgan','NYSE',302.4,.62,81,'BUY'],['SAP','SAP','XETRA',276.1,-.24,80,'BUY'],['NOVO-B','Novo Nordisk','CPH',365.2,1.71,79,'BUY'],['META','Meta','NASDAQ',769.25,-1.12,76,'HOLD'],['AMD','AMD','NASDAQ',179.8,-.54,73,'HOLD'],['TSLA','Tesla','NASDAQ',337.2,3.26,71,'HOLD'],['MC','LVMH','EPA',483.8,-.66,64,'HOLD']];let fav=JSON.parse(localStorage.fav||'[]'),p='dash',sel='NVDA',prov=localStorage.prov||'openai';const get=t=>S.find(x=>x[0]==t)||S[0];const N=[['dash','Dashboard'],['market','Wereldmarkt'],['watch','Watchlist'],['research','AI Research'],['portfolio','Portfolio'],['backtest','Backtesting'],['alerts','Alerts'],['news','Nieuws'],['settings','Instellingen']];function go(x){p=x;draw()}function toggle(t){fav=fav.includes(t)?fav.filter(x=>x!=t):[...fav,t];localStorage.fav=JSON.stringify(fav);draw()}function table(a=S){return `<div class="card" style="padding:0;overflow:auto"><table><tr><th></th><th>Aandeel</th><th>Beurs</th><th>Prijs</th><th>Dag</th><th>AI</th><th>Signaal</th></tr>${a.map(x=>`<tr><td><button class="star" onclick="event.stopPropagation();toggle('${x[0]}')">${fav.includes(x[0])?'★':'☆'}</button></td><td onclick="sel='${x[0]}';go('research')"><b>${x[0]}</b><br><span class="m">${x[1]}</span></td><td>${x[2]}</td><td>${x[3]}</td><td class="${x[4]>=0?'g':'r'}">${x[4]>=0?'+':''}${x[4]}%</td><td><span class="pill ${x[5]>=85?'g':'y'}">${x[5]}/100</span></td><td>${x[6]}</td></tr>`).join('')}</table></div>`}
function dash(){let top=[...S].sort((a,b)=>b[5]-a[5]).slice(0,6);return `<div class="hero"><div><h1>AI Trading Intelligence</h1><span class="m">16 modules: universe · technicals · fundamentals · news · AI · risk · portfolio · backtesting</span></div><button class="btn primary" onclick="go('research')">✦ Start AI Research</button></div><div class="grid"><div class="card"><span class="m">Wereld-universe</span><div class="big">50K+</div></div><div class="card"><span class="m">Watchlist</span><div class="big">${fav.length}</div></div><div class="card"><span class="m">AI provider</span><div class="big">${prov=='openai'?'ChatGPT':prov=='anthropic'?'Claude':'Gemini'}</div></div><div class="card"><span class="m">Paper portfolio</span><div class="big">€100K</div></div></div><br><div class="two"><div class="card"><h3>AI Top Opportunities</h3>${table(top)}</div><div class="card"><h3>Multi-AI Consensus</h3><div class="box">Bull AI + Bear AI + Judge AI kunnen onafhankelijk werken. Met drie providers ontstaat een consensus-score.</div>${top.slice(0,4).map(x=>`<p><b>${x[0]}</b> <span class="g">${x[5]}/100</span><br><span class="m">ChatGPT ${x[5]} · Claude ${x[5]-2} · Gemini ${Math.min(99,x[5]+2)}</span></p>`).join('')}</div></div>`}
function market(){let q=document.getElementById('q').value.toLowerCase(),a=S.filter(x=>x.join(' ').toLowerCase().includes(q));return `<div class="hero"><div><h1>Wereldmarkt</h1><span class="m">Screening, ranking en aandelen-universe</span></div></div><div class="three"><div class="card"><span class="m">Bullish breadth</span><div class="big g">68%</div><div class="bar"><i style="width:68%"></i></div></div><div class="card"><span class="m">Strong Buy</span><div class="big">${S.filter(x=>x[5]>=90).length}</div></div><div class="card"><span class="m">High risk</span><div class="big r">18%</div></div></div><br>${table(a)}</div>`}
function watch(){let a=fav.map(get);return `<div class="hero"><div><h1>Watchlists</h1><span class="m">Favorieten en automatische AI-research</span></div><button class="btn primary" onclick="go('research')">Analyseer</button></div>${a.length?table(a):'<div class="card">Nog geen favorieten. Klik ☆.</div>'}`}
function research(){let x=get(sel);return `<div class="hero"><div><h1>AI Research · ${x[0]}</h1><span class="m">${x[1]} · ${x[2]} · €${x[3]}</span></div><button class="btn primary" onclick="ai()">✦ Run AI Council</button></div><div class="grid"><div class="card"><span class="m">AI score</span><div class="big">${x[5]}/100</div><div class="bar"><i style="width:${x[5]}%"></i></div></div><div class="card"><span class="m">Technisch</span><div class="big">92</div></div><div class="card"><span class="m">Fundamenteel</span><div class="big">90</div></div><div class="card"><span class="m">Risico</span><div class="big r">${100-x[5]}</div></div></div><br><div class="two"><div class="card"><h3>Research matrix</h3>${[['Technicals',92],['Fundamentals',90],['Momentum',95],['Valuation',68],['News',84],['Sentiment',86],['Macro',77],['Quality',91]].map(z=>`<p>${z[0]} <b style="float:right">${z[1]}</b></p><div class="bar"><i style="width:${z[1]}%"></i></div>`).join('')}<div class="chart">${[55,70,63,80,75,91,88,96,82,94,99,90].map(v=>`<i class="c" style="height:${v}%"></i>`).join('')}</div></div><div class="card"><h3>AI Analyst</h3><div id="out" class="m">Klik Run AI Council. Standalone gebruikt demo-data; de backend gebruikt echte provider-API's.</div></div></div><br><div class="card"><h3>AI Bull / Bear / Judge</h3><p class="m">Bull: groeikansen · Bear: risico's · Judge: gewogen eindscore. Resultaten worden opgeslagen als research snapshot zodra een database is gekoppeld.</p></div>`}
async function ai(){let o=document.getElementById('out');o.textContent='AI Council draait…';try{let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker:sel,stock:get(sel),provider:prov,mode:'council'})});let j=await r.json();o.textContent=j.analysis||j.error}catch(e){o.textContent=`Standalone demo — ${sel}\n\nBULL: sterk momentum en kwaliteit.\nBEAR: waardering en macro kunnen volatiliteit verhogen.\nJUDGE: ${get(sel)[6]}, score ${get(sel)[5]}/100.\n\nLive modus: start backend en configureer API keys.`}}
function portfolio(){return `<div class="hero"><div><h1>Portfolio</h1><span class="m">Paper trading · allocatie · P&L · drawdown</span></div></div><div class="grid"><div class="card"><span class="m">Value</span><div class="big">€100K</div></div><div class="card"><span class="m">Vandaag</span><div class="big g">+1.84%</div></div><div class="card"><span class="m">CAGR</span><div class="big g">18.7%</div></div><div class="card"><span class="m">Drawdown</span><div class="big r">-4.1%</div></div></div><br>${table(S.slice(0,6))}`}
function backtest(){return `<div class="hero"><div><h1>Backtesting Lab</h1><span class="m">Walk-forward · transactiekosten · slippage · Monte Carlo-ready</span></div><button class="btn primary" onclick="alert('Backtest engine active zodra historische OHLCV-data gekoppeld is.')">Run backtest</button></div><div class="grid"><div class="card"><span class="m">CAGR</span><div class="big g">18.7%</div></div><div class="card"><span class="m">Sharpe</span><div class="big">1.42</div></div><div class="card"><span class="m">Win rate</span><div class="big">63%</div></div><div class="card"><span class="m">Max DD</span><div class="big r">-13.8%</div></div></div><br><div class="card form"><label>Entry AI-score<input value="85"></label><label>Exit AI-score<input value="70"></label><label>Max positie %<input value="10"></label><label>Stop loss %<input value="8"></label></div>`}
function alerts(){return `<div class="hero"><div><h1>Alerts</h1><span class="m">Prijs · AI-score · sentiment · earnings · nieuws</span></div><button class="btn primary" onclick="alert('Alert opgeslagen')">+ Alert</button></div><div class="three"><div class="card"><h3>AI</h3><p>NVDA ≥ 90</p><span class="g">ACTIEF</span></div><div class="card"><h3>Prijs</h3><p>ASML &lt; €620</p><span class="g">ACTIEF</span></div><div class="card"><h3>Nieuws</h3><p>Breaking news watchlist</p><span class="g">ACTIEF</span></div></div>`}
function news(){return `<div class="hero"><div><h1>Nieuws & Sentiment</h1><span class="m">News feeds, filings, earnings en sentimentanalyse</span></div></div><div class="three">${['AI capex blijft groeimotor','Europese semiconductors verbeteren','Rente blijft macro-risico'].map((n,i)=>`<div class="card"><span class="pill ${i==2?'y':'g'}">${i==2?'NEUTRAL':'POSITIVE'}</span><h3>${n}</h3><span class="m">Impact ${82-i*8}/100</span></div>`).join('')}</div>`}
function settings(){return `<div class="hero"><div><h1>Instellingen</h1><span class="m">AI providers, datafeeds, risk controls en security</span></div></div><div class="two"><div class="card"><h3>AI Provider</h3><div class="form"><select id="pr"><option value="openai">ChatGPT / OpenAI</option><option value="anthropic">Claude / Anthropic</option><option value="google">Gemini / Google</option></select><button class="btn primary" onclick="prov=pr.value;localStorage.prov=prov;alert('Provider opgeslagen')">Opslaan</button></div><div class="box">API keys horen alleen op de server in .env. Nooit in HTML of GitHub.</div></div><div class="card"><h3>AI Council</h3><p>✓ ChatGPT</p><p>✓ Claude</p><p>✓ Gemini</p><p class="m">Alle drie kunnen parallel dezelfde researchdata beoordelen.</p></div></div><br><div class="card form"><h3>Risk controls</h3><label>Max positie %<input value="10"></label><label>Max sector %<input value="30"></label><label>Stop loss %<input value="8"></label><label>Min consensus<input value="80"></label></div><br><div class="card"><h3>16 modules</h3><p>1 Global universe · 2 Charts · 3 Technicals · 4 Fundamentals · 5 News · 6 Sentiment · 7 AI scoring · 8 Multi-AI · 9 Watchlists · 10 Alerts · 11 Top opportunities · 12 Risk · 13 Earnings · 14 Portfolio · 15 Backtesting · 16 AI research reports</p></div>`}
function draw(){nav.innerHTML=N.map(n=>`<button class="n ${p==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');app.innerHTML={dash,market,watch,research,portfolio,backtest,alerts,news,settings}[p]();if(p=='settings')pr.value=prov}q.oninput=()=>{if(p!='market')p='market';draw()};draw();</script></html>
